<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elec-Buddy — Maintenance</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #070D1A;
      color: #DDE5EF;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 28px;
      opacity: 0.6;
    }

    .wordmark {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.05em;
      color: #C8A44A;
      margin-bottom: 32px;
    }

    .rule {
      width: 40px;
      height: 2px;
      background: #C8A44A;
      margin: 0 auto 32px;
      opacity: 0.5;
    }

    h1 {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: clamp(1.4rem, 4vw, 1.75rem);
      font-weight: normal;
      line-height: 1.3;
      color: #FFFFFF;
      margin-bottom: 20px;
      text-wrap: balance;
    }

    p {
      font-size: 15px;
      line-height: 1.75;
      color: #8FA3B8;
      max-width: 400px;
      margin: 0 auto;
    }

    .footer {
      margin-top: 48px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2E5577;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <svg class="icon" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="28" cy="28" r="27" stroke="#C8A44A" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="M28 14 L32 26 H44 L34 33 L38 45 L28 38 L18 45 L22 33 L12 26 H24 Z" fill="none" stroke="#C8A44A" stroke-width="1.2" stroke-linejoin="round"/>
    </svg>

    <div class="wordmark">Elec-Buddy</div>
    <div class="rule"></div>

    <h1>We'll be back soon</h1>

    <p>Due to the growing number of users, our current platform has been experiencing instability and frequent crashes. We are sorry for the inconvenience. We are working on a more stable and improved version and will be back soon.</p>

    <div class="footer">elec-buddy &nbsp;&middot;&nbsp; under maintenance</div>

  </div>
</body>
</html>
