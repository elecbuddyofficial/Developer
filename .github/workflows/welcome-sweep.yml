name: Sweep Welcome Emails

# Catches welcome emails the signup page failed to send. The browser is the
# fast path; this is the safety net, so an empty run is the normal, healthy
# outcome.
#
# Hourly, not every 15 minutes. The first version asked for */15 and GitHub
# delivered ONE run in six hours: scheduled workflows are explicitly
# best-effort and the shorter the interval the more often they are dropped
# entirely. A backstop that runs once in six hours is not a backstop, and an
# hourly schedule that actually fires beats a quarter-hourly one that does not.
#
# Hourly is enough because this is only a net. The signup page sends the email
# within seconds and is the path that should always win; if it ever misses,
# an hour is an acceptable wait for a welcome that would otherwise never
# arrive. If this ever starts catching people regularly, the client is broken
# again and that is the thing to fix, not this interval.
#
# For a hard guarantee, pg_cron and pg_net are available on Supabase and would
# run this from inside the database with no dependency on GitHub at all.
#
# Uses the same CRON_SECRET and SUPABASE_FUNCTIONS_URL secrets already
# configured for the expiry emails.

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the hour to avoid the busiest minute
  workflow_dispatch:        # manual trigger for testing

# A slow run must never overlap the next tick and double-claim. The function
# is idempotent anyway (claiming is a compare-and-swap), so this is belt and
# braces rather than the actual guarantee.
concurrency:
  group: welcome-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sweep-welcome-emails Edge Function
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/sweep-welcome-emails")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Edge Function returned non-200 status"
            exit 1
          fi
