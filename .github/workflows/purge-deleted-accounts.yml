name: Purge Deleted Accounts

# Destroys accounts whose 30 day grace period has expired. Runs an hour after
# the expiry-email job rather than alongside it, so the two never contend and a
# failure in the logs is unambiguously one job or the other.
#
# Uses the same CRON_SECRET and SUPABASE_FUNCTIONS_URL secrets already
# configured for the expiry emails.

on:
  schedule:
    - cron: '0 9 * * *'   # 9:00 AM UTC every day
  workflow_dispatch:        # manual trigger for testing

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger purge-deleted-accounts Edge Function
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/purge-deleted-accounts")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Edge Function returned non-200 status"
            exit 1
          fi
